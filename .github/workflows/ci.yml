name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 1) Install with lockfile enforcement
      - name: Install
        run: npm ci

      # 2) Format check
      - name: Prettier check
        run: npx prettier --check "src/**/*.{ts,tsx}"

      # 3) Lint
      - name: Lint
        run: npm run lint

      # 4) Type check
      - name: Type check
        run: npm run typecheck

      # 5) Unit + property-based tests
      - name: Unit & property tests
        run: npm test

      # 6) Dependency audit (non-blocking; report high severity)
      - name: Dependency audit
        run: npm audit --audit-level=high || true

      # 7) Production build
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e

  container:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build -t cisco-wifi-planner:ci .

  # Staging deploy would run here after `container`, followed by a staging smoke
  # test. Production deploy requires a MANUAL approval gate (GitHub Environments
  # protection rule) and is intentionally not automated in this workflow.
